<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workspace git map</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --panel-2: #fafaf8; --ink: #1c1c1a; --muted: #6b6a64; --faint: #9a9992;
  --line: #e4e3dd; --line-2: #efeee9; --accent: #2f5bd3; --accent-bg: #e9efff;
  --good: #1d7a3e; --good-bg: #e3f4e8; --warn: #9a5b00; --warn-bg: #fff1d9; --bad: #b42318; --bad-bg: #fde9e7;
  --rel: #7a3fb8; --rel-bg: #f2e9fc; --sel: #fff7d6; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
  --l0: #2f5bd3; --l1: #d0457a; --l2: #1f8a70; --l3: #c77700; --l4: #7a3fb8; --l5: #0e8fb3; --l6: #a3562b; --l7: #5b7a12;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312; --panel: #1c1c1b; --panel-2: #222220; --ink: #ecebe6; --muted: #a3a29b; --faint: #75746e;
    --line: #33322e; --line-2: #2a2a27; --accent: #8aa8ff; --accent-bg: #1f2840;
    --good: #74d39a; --good-bg: #17301f; --warn: #ffc266; --warn-bg: #36290f; --bad: #ff8a80; --bad-bg: #3a1c1a;
    --rel: #c9a2ff; --rel-bg: #2c2140; --sel: #2f2a14; --shadow: none;
    --l0: #7f9dff; --l1: #ff7aa8; --l2: #4fd1a8; --l3: #ffb340; --l4: #c39bff; --l5: #4cc8f0; --l6: #e39463; --l7: #a8cf4a;
  }
}
:root[data-theme="dark"] {
  --bg: #131312; --panel: #1c1c1b; --panel-2: #222220; --ink: #ecebe6; --muted: #a3a29b; --faint: #75746e;
  --line: #33322e; --line-2: #2a2a27; --accent: #8aa8ff; --accent-bg: #1f2840;
  --good: #74d39a; --good-bg: #17301f; --warn: #ffc266; --warn-bg: #36290f; --bad: #ff8a80; --bad-bg: #3a1c1a;
  --rel: #c9a2ff; --rel-bg: #2c2140; --sel: #2f2a14; --shadow: none;
  --l0: #7f9dff; --l1: #ff7aa8; --l2: #4fd1a8; --l3: #ffb340; --l4: #c39bff; --l5: #4cc8f0; --l6: #e39463; --l7: #a8cf4a;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
code, .mono { font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace; font-size: 12.5px; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { margin: 0; padding: 10px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: 15px; margin: 0; white-space: nowrap; }
.brand .ws { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spacer { flex: 1; }
.search { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 10px; min-width: 220px; }
.search input { border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; width: 100%; }
.iconbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 9px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.iconbtn:hover { color: var(--ink); border-color: var(--faint); }

.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
main { min-width: 0; padding: 18px 22px 60px; }

/* sidebar: each base repo first, its worktrees below */
.side { position: sticky; top: var(--top, 53px); height: calc(100vh - var(--top, 53px)); overflow: auto;
  border-right: 1px solid var(--line); background: var(--panel); padding: 14px 10px 30px; }
.side-repo + .side-repo { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.side-rh { display: flex; align-items: center; gap: 8px; padding: 0 6px 4px; cursor: pointer; }
.side-rh .nm { font-weight: 650; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-rh .ct { margin-left: auto; color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.side-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; padding: 10px 8px 4px; }
.side-item { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; border-radius: 9px;
  padding: 7px 8px; cursor: pointer; margin: 1px 0; }
.side-item:hover { background: var(--panel-2); border-color: var(--line); }
.side-item.base-item { background: var(--panel-2); border-color: var(--line); }
.side-item.sel, .side-item.base-item.sel { background: var(--accent-bg); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.side-item .l1 { display: flex; align-items: center; gap: 7px; min-width: 0; }
.side-item .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-item .kd { color: var(--faint); flex: none; display: inline-flex; }
.side-item .dt { margin-left: auto; flex: none; display: inline-flex; gap: 4px; }
.side-item .dt .chip { font-size: 11px; padding: 0 6px; }
.side-item .l2 { display: flex; align-items: center; gap: 6px; margin: 3px 0 0 19px; min-width: 0; }
.side-item .l2 .mono { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.side-item .lane { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.side-item .l3 { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0 0 19px; }
.side-item .l3 .chip { font-size: 11px; padding: 0 6px; }
.side .none-wt { color: var(--faint); font-size: 12px; padding: 4px 8px; }
@keyframes flash { 0% { background: var(--accent-bg); box-shadow: inset 4px 0 0 var(--accent); } 100% { background: var(--sel); box-shadow: inset 4px 0 0 transparent; } }
.grow.flash { animation: flash 1.4s ease-out; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; max-height: 50vh; border-right: 0; border-bottom: 1px solid var(--line); }
}
.meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.meta b { color: var(--ink); font-weight: 600; }
.stale { color: var(--warn); }

/* repo */
.repo { margin-bottom: 34px; }
.repo-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 6px 0 12px; }
.repo-head h2 { font-size: 20px; margin: 0; }
.repo-head .url { color: var(--muted); }
.model { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.model code { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow); }
.stat .n { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: 12px; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 10px; font-weight: 650; }

/* chips */
.chip { display: inline-flex; align-items: center; gap: 3px; border-radius: 999px; padding: 1px 8px; font-size: 12px;
  font-variant-numeric: tabular-nums; white-space: nowrap; border: 1px solid transparent; }
.c-good { background: var(--good-bg); color: var(--good); }
.c-warn { background: var(--warn-bg); color: var(--warn); }
.c-bad { background: var(--bad-bg); color: var(--bad); }
.c-release { background: var(--rel-bg); color: var(--rel); }
.c-muted { background: var(--line-2); color: var(--muted); }
.c-accent { background: var(--accent-bg); color: var(--accent); }
.c-outline { border-color: var(--line); color: var(--muted); }
.ab { display: inline-flex; gap: 4px; align-items: center; }
.synced { color: var(--good); font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
.none { color: var(--faint); font-size: 12px; }
.base-name { color: var(--faint); font-size: 12px; }

/* two-pane */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
@media (max-width: 1240px) { .split { grid-template-columns: 1fr; } .detail { position: static !important; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-head .t { font-weight: 650; }
.legend { display: flex; gap: 10px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

/* graph */
.graph { position: relative; overflow-x: auto; }
.graph svg { position: absolute; left: 0; top: 0; pointer-events: none; }
.grow { display: flex; align-items: center; gap: 8px; height: 30px; padding-right: 12px; cursor: pointer; white-space: nowrap;
  border-bottom: 1px solid transparent; }
.grow:hover { background: var(--panel-2); }
.grow.on { background: var(--sel); }
.grow.dim { opacity: .38; }
.grow.match { box-shadow: inset 3px 0 0 var(--accent); }
.grow .sha { color: var(--faint); flex: none; }
.grow .refs { display: flex; gap: 4px; flex: none; }
.grow .subj { overflow: hidden; text-overflow: ellipsis; min-width: 60px; flex: 1; }
.grow .age { color: var(--faint); font-size: 12px; flex: none; }
.ref { display: inline-flex; align-items: center; gap: 4px; border-radius: 5px; padding: 0 6px; font-size: 11.5px; line-height: 19px;
  font-family: ui-monospace, "Cascadia Code", Consolas, monospace; border: 1px solid var(--line); background: var(--panel); }
.ref.local { border-color: color-mix(in srgb, var(--lc) 55%, transparent); color: var(--lc);
  background: color-mix(in srgb, var(--lc) 10%, var(--panel)); font-weight: 600; }
.ref.remote { color: var(--muted); border-style: dashed; }
.ref.wt { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; }
.ref .sync { opacity: .7; font-weight: 400; }
.trunc { padding: 8px 14px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }

/* detail */
.detail { position: sticky; top: calc(var(--top, 53px) + 12px); max-height: calc(100vh - var(--top, 53px) - 24px); overflow: auto; }
.detail .body { padding: 14px; }
.detail .empty { color: var(--muted); padding: 30px 14px; text-align: center; }
.detail h4 { margin: 0; font-size: 16px; overflow-wrap: anywhere; font-family: ui-monospace, Consolas, monospace; }
.detail .sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; overflow-wrap: anywhere; }
.cmp { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cmp-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--panel-2);
  border-bottom: 1px solid var(--line); gap: 8px; }
.cmp-head .what { font-size: 12px; color: var(--muted); }
.cmp-head .ref-n { font-size: 12.5px; overflow-wrap: anywhere; }
.big { display: flex; gap: 14px; padding: 10px 12px; }
.big div { font-variant-numeric: tabular-nums; }
.big .n { font-size: 20px; font-weight: 650; }
.big .l { font-size: 11.5px; color: var(--muted); }
.clist { list-style: none; margin: 0; padding: 0 12px 10px; }
.clist .lh { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 6px 0 4px; }
.clist li { display: flex; gap: 8px; font-size: 12.5px; padding: 2px 0; }
.clist li code { color: var(--faint); flex: none; }
.clist li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.copy { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 1px 6px; font-size: 11.5px; color: var(--muted); }
.copy:hover { color: var(--ink); }

/* table */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
.tab.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.tab .n { opacity: .7; margin-left: 3px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650;
  padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
tr.brow { cursor: pointer; }
tr.brow:hover td { background: var(--panel-2); }
tr.brow.sel td { background: var(--sel); }
td .bn { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; font-weight: 600; }
td .co { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
.div { display: grid; grid-template-columns: 54px 1px 54px; align-items: center; gap: 0; height: 10px; }
.div .l { justify-self: end; height: 8px; border-radius: 4px 0 0 4px; background: var(--warn); }
.div .r { height: 8px; border-radius: 0 4px 4px 0; background: var(--good); }
.div .m { height: 14px; background: var(--faint); }
.cell-ab { display: flex; align-items: center; gap: 10px; }
.remote-only { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 12.5px; }
footer { color: var(--muted); font-size: 12px; margin-top: 30px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
footer code { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; overflow-wrap: anywhere; }
@media (max-width: 640px) {
  .top-in, main { padding-left: 16px; padding-right: 16px; }
  .search { min-width: 0; flex: 1; }
  .grow .age { display: none; }
}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="9" r="2.2"/><path d="M6 7.2v9.6M18 11.2c0 4-6 3-11 6"/></svg>
    <h1>Workspace git map</h1>
    <span class="ws mono" id="ws"></span>
  </div>
  <div class="spacer"></div>
  <label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Filter branches, commits…" autocomplete="off"></label>
  <button class="iconbtn" id="theme" title="Toggle theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</div></div>
<div class="shell"><aside class="side" id="side" aria-label="Repos and worktrees"></aside><main id="app"></main></div>

<script>
const DATA = /*__GRAPH_DATA__*/null;

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const LANES = 8, RH = 30, LW = 16, PAD = 14;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// theme
(function () {
  const t = store.get("mygit-graph-theme");
  if (t) document.documentElement.dataset.theme = t;
  $("#theme").onclick = () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    store.set("mygit-graph-theme", next);
  };
})();

const icon = {
  base: '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg>',
  worktree: '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 21 12 12 21 3 12z"/></svg>',
  external: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3 21 12 12 21 3 12z"/></svg>',
  folder: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 6h6l2 2h10v11H3z"/></svg>',
  check: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg>',
  cloud: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9a4.5 4.5 0 0 0 1 9z"/></svg>',
};

function ab(pair, syncedText) {
  if (!pair) return '<span class="none">—</span>';
  const [a, b] = pair;
  if (!a && !b) return `<span class="synced">${icon.check}${esc(syncedText)}</span>`;
  return '<span class="ab">' + (a ? `<span class="chip c-good" title="ahead">↑${a}</span>` : "") +
         (b ? `<span class="chip c-warn" title="behind">↓${b}</span>` : "") + "</span>";
}
function divbar(pair, max) {
  if (!pair) return "";
  const s = n => n ? Math.max(6, Math.round(54 * Math.log1p(n) / Math.log1p(max || 1))) : 0;
  return `<span class="div" title="↓${pair[1]} behind · ↑${pair[0]} ahead"><span class="l" style="width:${s(pair[1])}px"></span><span class="m"></span><span class="r" style="width:${s(pair[0])}px"></span></span>`;
}
function remoteCell(b) {
  if (b.gone) return `<span class="chip c-bad">upstream gone</span>`;
  if (!b.upstream) return '<span class="none">local only</span>';
  return ab(b.vs_remote, "synced");
}
function noteChips(b) { return (b.notes || []).map(n => `<span class="chip c-${n.kind}">${esc(n.text)}</span>`).join(" "); }
function ago(iso) {
  if (!iso) return "never";
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return "just now"; if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60); if (h < 48) return `${h} h ago`;
  return `${Math.round(h / 24)} days ago`;
}

// ---- lane layout ---------------------------------------------------------------------------------------------
function layout(commits) {
  const row = new Map(commits.map((c, i) => [c.sha, i]));
  const lanes = [];
  const free = () => { const i = lanes.indexOf(null); return i < 0 ? lanes.length : i; };
  let width = 1;
  commits.forEach((c, r) => {
    let l = lanes.indexOf(c.sha);
    if (l < 0) { l = free(); }
    for (let i = 0; i < lanes.length; i++) if (i !== l && lanes[i] === c.sha) lanes[i] = null;
    c.lane = l; c.row = r; c.edges = [];
    const ps = c.parents;
    if (!ps.length) { lanes[l] = null; }
    ps.forEach((p, k) => {
      const inSet = row.has(p);
      let e;
      if (k === 0) { e = l; lanes[l] = inSet ? p : null; }
      else if (inSet) { e = lanes.indexOf(p); if (e < 0) { e = free(); lanes[e] = p; } }
      else { e = free(); }
      c.edges.push({ p, e, inSet });
      width = Math.max(width, e + 1);
    });
    width = Math.max(width, l + 1);
    while (lanes.length && lanes[lanes.length - 1] === null) lanes.pop();
  });
  return { row, width };
}
function graphSVG(commits, L, pick) {
  const x = l => PAD + l * LW, y = r => r * RH + RH / 2;
  const col = l => `var(--l${l % LANES})`;
  const W = PAD * 2 + (L.width - 1) * LW, H = commits.length * RH;
  let paths = "", dots = "";
  for (const c of commits) {
    for (const ed of c.edges) {
      const x1 = x(c.lane), y1 = y(c.row), xe = x(ed.e);
      if (!ed.inSet) {
        paths += `<path d="M${x1} ${y1} C${x1} ${y1 + RH * .5} ${xe} ${y1 + RH * .3} ${xe} ${y1 + RH * .8}" stroke="${col(ed.e)}" stroke-width="2" fill="none" stroke-dasharray="3 3" opacity=".6"/>`;
        continue;
      }
      const p = commits[L.row.get(ed.p)], x2 = x(p.lane), y2 = y(p.row);
      let d;
      if (p.row === c.row + 1) d = `M${x1} ${y1} C${x1} ${y1 + RH / 2} ${x2} ${y2 - RH / 2} ${x2} ${y2}`;
      else if (ed.e === c.lane) d = `M${x1} ${y1} V${y2 - RH} C${x1} ${y2 - RH / 2} ${x2} ${y2 - RH / 2} ${x2} ${y2}`;
      else d = `M${x1} ${y1} C${x1} ${y1 + RH / 2} ${xe} ${y1 + RH / 2} ${xe} ${y1 + RH} V${y2 - RH} C${xe} ${y2 - RH / 2} ${x2} ${y2 - RH / 2} ${x2} ${y2}`;
      paths += `<path d="${d}" stroke="${col(ed.e)}" stroke-width="2" fill="none" data-c="${c.sha}" data-p="${p.sha}"/>`;
    }
    const merge = c.parents.length > 1, tip = c.refs.length > 0;
    dots += `<circle cx="${x(c.lane)}" cy="${y(c.row)}" r="${tip ? 5.5 : merge ? 3.5 : 4}" fill="${merge && !tip ? "var(--panel)" : col(c.lane)}" stroke="${col(c.lane)}" stroke-width="2" data-s="${c.sha}"/>`;
  }
  return { svg: `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${paths}${dots}</svg>`, W };
}

// ---- render --------------------------------------------------------------------------------------------------
const state = { sel: {}, filter: {}, q: "" };

function render() {
  if (!DATA) { $("#app").innerHTML = '<p>No data. Run workspace_graph.py --open.</p>'; return; }
  $("#ws").textContent = DATA.workspace;
  document.title = `git map · ${DATA.workspace.split("/").pop()}`;
  let h = `<div class="meta"><span>Generated <b>${esc(new Date(DATA.generated).toLocaleString())}</b></span>
    <span>Profile <b>${esc(DATA.profile || "none (folder scan)")}</b></span>
    <span>Worktree root <b class="mono">${esc(DATA.worktreeRoot)}</b></span>
    <span>Remote <b class="mono">${esc(DATA.remote)}</b></span>
    <span>${DATA.repos.length} repo${DATA.repos.length === 1 ? "" : "s"}</span></div>`;
  DATA.repos.forEach((r, i) => h += repoHTML(r, i));
  h += `<footer>Refresh: <code id="cmd">${esc(DATA.command)}</code><button class="copy" data-copy="#cmd">copy</button>
        <span>add <code>--fetch</code> to update remote branches first</span></footer>`;
  $("#app").innerHTML = h;
  DATA.repos.forEach((r, i) => wireRepo(r, i));
  renderSide();
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const t = b.dataset.copy.startsWith("#") ? $(b.dataset.copy).textContent : b.dataset.copy;
    navigator.clipboard?.writeText(t).then(() => { b.textContent = "copied"; setTimeout(() => b.textContent = "copy", 1200); });
  });
}

function commitAt(r, sha) { return sha ? r.commits.find(x => x.sha.startsWith(sha)) || null : null; }

function abSpan(pair) {
  return (pair[0] ? ` <span style="color:var(--good)">↑${pair[0]}</span>` : "") + (pair[1] ? ` <span style="color:var(--warn)">↓${pair[1]}</span>` : "");
}

function sideItem(r, i, c) {
  const b = r.branches.find(x => x.name === c.branch) || null;
  const tip = commitAt(r, b ? b.sha : c.head);
  const name = c.kind === "base" ? c.rel : c.rel.split("/").pop();
  const dot = tip ? `<span class="lane" style="background:var(--l${tip.lane % LANES})" title="its lane color in the graph"></span>`
                  : `<span class="lane" style="border:1.5px dashed var(--faint)" title="tip not drawn in the graph"></span>`;
  const st = [];
  if (c.missing) st.push('<span class="chip c-bad">missing</span>');
  if (c.dirty) st.push(`<span class="chip c-warn" title="changed files">${c.dirty} changed</span>`);
  if (c.untracked) st.push(`<span class="chip c-muted" title="untracked files">${c.untracked} new</span>`);
  const chips = [];
  if (b) {
    if (b.gone) chips.push('<span class="chip c-bad">upstream gone</span>');
    else if (!b.upstream) chips.push('<span class="chip c-outline">local only</span>');
    else if (b.vs_remote && (b.vs_remote[0] || b.vs_remote[1])) chips.push(`<span class="chip c-outline" title="vs ${esc(b.upstream)}">${icon.cloud}${abSpan(b.vs_remote)}</span>`);
    else chips.push(`<span class="chip c-outline" title="in sync with ${esc(b.upstream)}">${icon.cloud}<span style="color:var(--good)">${icon.check}</span></span>`);
    if (b.vs_base && (b.vs_base[0] || b.vs_base[1])) chips.push(`<span class="chip c-outline" title="vs ${esc(b.base)}">base${abSpan(b.vs_base)}</span>`);
    (b.notes || []).filter(n => n.kind !== "muted" || n.text === "merged").forEach(n => chips.push(`<span class="chip c-${n.kind}">${esc(n.text)}</span>`));
  }
  return `<button class="side-item ${c.kind === "base" ? "base-item" : ""}" data-repo="${i}" data-branch="${esc(c.branch || "")}" data-head="${esc(c.head)}" title="${esc(c.path)}">
    <div class="l1"><span class="kd">${icon[c.kind]}</span><span class="nm mono">${esc(name)}</span><span class="dt">${st.join("") || `<span class="synced" title="clean working tree">${icon.check}</span>`}</span></div>
    <div class="l2">${dot}<span class="mono">${c.branch ? esc(c.branch) : `detached @${esc(c.head)}`}</span></div>
    ${chips.length ? `<div class="l3">${chips.join("")}</div>` : ""}
  </button>`;
}

function renderSide() {
  let h = "";
  DATA.repos.forEach((r, i) => {
    const base = r.checkouts.filter(c => c.kind === "base");
    const wts = r.checkouts.filter(c => c.kind !== "base");
    h += `<div class="side-repo"><div class="side-rh" data-goto="${i}" title="${esc(r.path)}">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2"><path d="M4 4h12l4 4v12H4z"/><path d="M8 4v6h7"/></svg>
        <span class="nm">${esc(r.name)}</span><span class="ct">${wts.length} worktree${wts.length === 1 ? "" : "s"}</span></div>
      <div class="side-lbl">Base repo</div>${base.map(c => sideItem(r, i, c)).join("")}
      <div class="side-lbl">Worktrees</div>${wts.map(c => sideItem(r, i, c)).join("") || '<div class="none-wt">no worktrees</div>'}
    </div>`;
  });
  const side = $("#side");
  side.innerHTML = h;
  DATA.repos.forEach((r, i) => state.sel[i] &&
    side.querySelectorAll(`.side-item[data-repo="${i}"]`).forEach(el => el.classList.toggle("sel", el.dataset.branch === state.sel[i])));
  side.onclick = e => {
    const g = e.target.closest("[data-goto]");
    if (g) return $(`#repo-${g.dataset.goto}`).scrollIntoView({ behavior: "smooth" });
    const it = e.target.closest(".side-item");
    if (!it) return;
    const i = +it.dataset.repo, r = DATA.repos[i];
    if (it.dataset.branch) return select(r, i, it.dataset.branch);
    const c = commitAt(r, it.dataset.head);  // detached HEAD: show that commit
    if (c) { showCommit(r, i, c); const row = $(`#graph-${i} .grow[data-sha="${c.sha}"]`); if (row) flashRow(row); }
  };
}

function repoHTML(r, i) {
  const act = r.branches.filter(FILTERS.action.test);
  const prod = r.branches.find(b => b.name === r.production);
  const unreleased = prod && prod.vs_base ? prod.vs_base[1] : 0;
  const dirty = r.checkouts.filter(c => c.dirty || c.untracked).length;
  const fetchedAgeH = r.fetched ? (Date.now() - new Date(r.fetched).getTime()) / 3.6e6 : Infinity;
  let h = `<section class="repo" id="repo-${i}">
  <div class="repo-head"><h2>${esc(r.name)}</h2><span class="url mono">${esc(r.remote_url || "(no remote)")}</span>
    <span class="model"><code>${esc(r.production)}</code>←<code>${esc(r.staging)}</code>←<span>work branches</span></span></div>
  <div class="stats">
    <div class="stat"><div class="n">${r.checkouts.length}</div><div class="l">checkouts (${r.checkouts.filter(c => c.kind !== "base").length} worktrees)</div></div>
    <div class="stat"><div class="n">${r.branches.length}</div><div class="l">local branches · ${r.remote_only.length} remote only</div></div>
    <div class="stat"><div class="n" style="color:var(${act.length ? "--warn" : "--good"})">${act.length}</div><div class="l">branches needing action (push / pull / diverged / release)</div></div>
    <div class="stat"><div class="n" style="color:var(--rel)">${unreleased}</div><div class="l">commits unreleased on ${esc(r.staging)}</div></div>
    <div class="stat"><div class="n">${dirty}</div><div class="l">checkouts with local changes</div></div>
    <div class="stat"><div class="n ${fetchedAgeH > 24 ? "stale" : ""}" style="font-size:16px;padding-top:5px">${esc(ago(r.fetched))}</div><div class="l">last fetch${DATA.fetchedNow ? " (fetched now)" : ""}</div></div>
  </div>
  `;
  h += `
  <div class="split" style="margin-top:18px">
    <div class="panel">
      <div class="panel-head"><span class="t">Commit graph</span>
        <span class="legend"><span><span class="ref wt">${icon.folder}checkout</span></span><span><span class="ref local" style="--lc:var(--l0)">local</span></span>
        <span><span class="ref remote">${icon.cloud}remote</span></span><span><span class="ref local" style="--lc:var(--l0)">x <span class="sync">${icon.cloud}</span></span> = local and remote at same commit</span></span>
        <span class="spacer"></span><span class="none">${r.graph_refs.length} refs · ${r.commits.length} commits</span></div>
      <div class="graph" id="graph-${i}"></div>
      ${r.truncated ? `<div class="trunc">Graph truncated. Re-run with a larger <code>--max-commits</code>.</div>` : ""}
    </div>
    <div class="panel detail" id="detail-${i}"><div class="empty">Select a branch, checkout or commit to see what it is ahead / behind.</div></div>
  </div>
  <h3>Branches</h3>
  <div class="panel">
    <div class="panel-head"><div class="tabs" id="tabs-${i}"></div></div>
    <div class="tablewrap"><table><thead><tr><th>Branch</th><th>Local vs remote</th><th>Base</th><th>Local vs base</th><th>Notes</th><th>Last commit</th></tr></thead>
    <tbody id="tbody-${i}"></tbody></table></div>
  </div>
  ${r.remote_only.length ? `<div class="remote-only">Remote only (${r.remote_only.length}): ${r.remote_only.map(n => `<span class="ref remote">${icon.cloud}${esc(n)}</span>`).join("")}</div>` : ""}
</section>`;
  return h;
}

const FILTERS = {
  active: { label: "Active", test: b => b.checkout || b.role !== "work" },
  action: { label: "Needs action", test: b => (b.notes || []).some(n => n.kind !== "muted") },
  merged: { label: "Merged", test: b => (b.notes || []).some(n => n.text === "merged") },
  local: { label: "Local only", test: b => !b.upstream },
  all: { label: "All", test: () => true },
};

function wireRepo(r, i) {
  const L = layout(r.commits);
  const { svg, W } = graphSVG(r.commits, L);
  const held = Object.fromEntries(r.branches.filter(b => b.checkout).map(b => [b.name, b.checkout]));
  const localNames = new Set(r.branches.map(b => b.name));
  const pre = r.remote + "/";
  let rows = "";
  for (const c of r.commits) {
    const locals = c.refs.filter(n => !n.startsWith(pre) || localNames.has(n));
    let remotes = c.refs.filter(n => n.startsWith(pre) && !localNames.has(n));
    let pills = "";
    const lc = `var(--l${c.lane % LANES})`;
    for (const n of locals) {
      const synced = remotes.includes(pre + n);
      if (synced) remotes = remotes.filter(x => x !== pre + n);
      if (held[n]) pills += `<span class="ref wt" title="checked out in ${esc(held[n])}">${icon.folder}${esc(held[n].split("/").pop())}</span>`;
      pills += `<span class="ref local" style="--lc:${lc}" data-b="${esc(n)}">${esc(n)}${synced ? ` <span class="sync" title="${esc(pre + n)} is here too">${icon.cloud}</span>` : ""}</span>`;
    }
    for (const n of remotes) pills += `<span class="ref remote">${icon.cloud}${esc(n)}</span>`;
    rows += `<div class="grow" data-sha="${c.sha}" style="padding-left:${W}px"><code class="sha">${c.sha.slice(0, 7)}</code>
      <span class="refs">${pills}</span><span class="subj" title="${esc(c.subject)}">${esc(c.subject)}</span><span class="age">${esc(c.age)}</span></div>`;
  }
  const g = $(`#graph-${i}`);
  g.innerHTML = svg + rows;
  g.onclick = e => {
    const pill = e.target.closest("[data-b]");
    if (pill) return select(r, i, pill.dataset.b);
    const row = e.target.closest(".grow");
    if (!row) return;
    const c = r.commits.find(x => x.sha === row.dataset.sha);
    const own = c.refs.find(n => localNames.has(n));
    own ? select(r, i, own) : showCommit(r, i, c);
  };
  state.filter[i] = state.filter[i] || "active";
  drawTable(r, i);
  const first = r.checkouts.find(c => c.branch);
  if (first) select(r, i, first.branch, true);
}

function drawTable(r, i) {
  const tabs = $(`#tabs-${i}`);
  tabs.innerHTML = Object.entries(FILTERS).map(([k, f]) =>
    `<button class="tab ${state.filter[i] === k ? "on" : ""}" data-f="${k}">${f.label}<span class="n">${r.branches.filter(f.test).length}</span></button>`).join("");
  tabs.onclick = e => { const t = e.target.closest("[data-f]"); if (t) { state.filter[i] = t.dataset.f; drawTable(r, i); } };
  const max = Math.max(1, ...r.branches.flatMap(b => [...(b.vs_remote || []), ...(b.vs_base || [])]));
  const q = state.q;
  const list = r.branches.filter(FILTERS[state.filter[i]].test)
    .filter(b => !q || (b.name + " " + (b.checkout || "") + " " + b.subject).toLowerCase().includes(q));
  $(`#tbody-${i}`).innerHTML = list.map(b => `<tr class="brow ${state.sel[i] === b.name ? "sel" : ""}" data-b="${esc(b.name)}">
    <td><span class="bn">${esc(b.name)}</span>${b.checkout ? `<span class="co">${icon.folder} ${esc(b.checkout)}</span>` : ""}</td>
    <td><div class="cell-ab">${b.upstream && !b.gone ? divbar(b.vs_remote, max) : ""}${remoteCell(b)}</div></td>
    <td class="base-name mono">${esc(b.base || "")}</td>
    <td><div class="cell-ab">${b.base ? divbar(b.vs_base, max) + ab(b.vs_base, "even") : ""}</div></td>
    <td>${noteChips(b)}</td>
    <td class="none" title="${esc(b.subject)}">${esc(b.age)}</td></tr>`).join("") ||
    `<tr><td colspan="6" class="none" style="padding:16px 12px">No branches match.</td></tr>`;
  $(`#tbody-${i}`).onclick = e => { const t = e.target.closest("[data-b]"); if (t) select(r, i, t.dataset.b); };
}

function clist(title, items, total) {
  if (!items || !items.length) return "";
  const more = total > items.length ? `<li class="none">… and ${total - items.length} more</li>` : "";
  return `<ul class="clist"><li class="lh">${esc(title)}</li>${items.map(c =>
    `<li><code>${esc(c.sha)}</code><span title="${esc(c.subject)}">${esc(c.subject)}</span></li>`).join("")}${more}</ul>`;
}

function cmpBlock(what, ref, pair, aheadT, behindT, ahead, behind, syncedText) {
  if (!ref) return "";
  const [a, b] = pair || [0, 0];
  return `<div class="cmp"><div class="cmp-head"><span class="what">${esc(what)}</span><code class="ref-n">${esc(ref)}</code></div>
    <div class="big"><div><div class="n" style="color:var(${a ? "--good" : "--faint"})">↑${a}</div><div class="l">ahead</div></div>
      <div><div class="n" style="color:var(${b ? "--warn" : "--faint"})">↓${b}</div><div class="l">behind</div></div>
      ${!a && !b ? `<div style="align-self:center" class="synced">${icon.check}${esc(syncedText)}</div>` : ""}</div>
    ${clist(aheadT, ahead, a)}${clist(behindT, behind, b)}</div>`;
}

function select(r, i, name, quiet) {
  const b = r.branches.find(x => x.name === name);
  if (!b) return;
  state.sel[i] = name;
  document.querySelectorAll(`.side-item[data-repo="${i}"]`).forEach(el => el.classList.toggle("sel", el.dataset.branch === name));
  document.querySelectorAll(`#tbody-${i} tr`).forEach(el => el.classList.toggle("sel", el.dataset.b === name));
  // graph: highlight the branch's own commits (ahead of its base) and its tip
  const own = new Set((b.ahead_base || []).map(c => c.sha));
  let tipRow = null;
  document.querySelectorAll(`#graph-${i} .grow`).forEach(el => {
    const s = el.dataset.sha, isTip = s.startsWith(b.sha);
    const on = isTip || [...own].some(x => s.startsWith(x));
    el.classList.toggle("on", on);
    el.classList.toggle("dim", !on);
    if (isTip) tipRow = el;
  });
  const co = r.checkouts.find(c => c.branch === name);
  $(`#detail-${i}`).innerHTML = `<div class="body">
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <span class="chip ${b.role === "work" ? "c-muted" : "c-accent"}">${esc(b.role)}</span>${noteChips(b)}
      <span class="spacer" style="flex:1"></span><button class="iconbtn" id="clear-${i}" title="Clear selection" style="padding:2px 7px">✕</button></div>
    <h4>${esc(b.name)}</h4>
    <div class="sub">${co ? `${icon[co.kind]} checked out in <b class="mono">${esc(co.rel)}</b> <button class="copy" data-copy="${esc(co.path)}">copy path</button>` : "not checked out"}</div>
    <div class="sub"><code>${esc(b.sha)}</code> ${esc(b.subject)} · ${esc(b.age)}</div>
    ${b.gone ? `<div class="cmp"><div class="cmp-head"><span class="what">remote</span><span class="chip c-bad">${esc(b.upstream)} was deleted</span></div></div>` :
      b.upstream ? cmpBlock("local vs remote", b.upstream, b.vs_remote, "Not pushed", "Not pulled", b.ahead_remote, b.behind_remote, "in sync with remote") :
      `<div class="cmp"><div class="cmp-head"><span class="what">remote</span><span class="none">no upstream, never pushed</span></div></div>`}
    ${b.base ? cmpBlock("local vs base", b.base, b.vs_base, `Commits on ${b.name.split("/").pop()} not in base`, "Commits in base not here", b.ahead_base, b.behind_base, "even with base") : ""}
  </div>`;
  $(`#clear-${i}`).onclick = () => clearSel(r, i);
  $(`#detail-${i}`).querySelectorAll("[data-copy]").forEach(btn => btn.onclick = () =>
    navigator.clipboard?.writeText(btn.dataset.copy).then(() => { btn.textContent = "copied"; setTimeout(() => btn.textContent = "copy path", 1200); }));
  if (tipRow && !quiet) flashRow(tipRow);
}

function flashRow(row) {
  row.scrollIntoView({ block: "center", behavior: "smooth" });
  row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
}

function showCommit(r, i, c) {
  document.querySelectorAll(`.side-item[data-repo="${i}"]`).forEach(el => el.classList.toggle("sel", !el.dataset.branch && c.sha.startsWith(el.dataset.head)));
  document.querySelectorAll(`#graph-${i} .grow`).forEach(el => { el.classList.toggle("on", el.dataset.sha === c.sha); el.classList.remove("dim"); });
  $(`#detail-${i}`).innerHTML = `<div class="body"><div style="display:flex;justify-content:space-between"><span class="chip c-muted">commit</span>
    <button class="iconbtn" id="clear-${i}" style="padding:2px 7px">✕</button></div>
    <h4 style="margin-top:8px">${esc(c.sha.slice(0, 12))}</h4>
    <div class="sub" style="color:var(--ink);font-size:14px;margin-top:8px">${esc(c.subject)}</div>
    <div class="sub">${esc(c.author)} · ${esc(c.age)} · ${esc(new Date(c.date).toLocaleString())}</div>
    <div class="sub">${c.parents.length > 1 ? "merge of " : "parent "}${c.parents.map(p => `<code>${p.slice(0, 7)}</code>`).join(", ") || "none (root)"}</div>
    <button class="copy" style="margin-top:10px" data-sha="${c.sha}">copy sha</button></div>`;
  $(`#clear-${i}`).onclick = () => clearSel(r, i);
  $(`#detail-${i} [data-sha]`).onclick = e => navigator.clipboard?.writeText(e.target.dataset.sha);
}

function clearSel(r, i) {
  state.sel[i] = null;
  document.querySelectorAll(`.side-item[data-repo="${i}"].sel, #tbody-${i} tr.sel`).forEach(el => el.classList.remove("sel"));
  document.querySelectorAll(`#graph-${i} .grow`).forEach(el => el.classList.remove("on", "dim"));
  $(`#detail-${i}`).innerHTML = '<div class="empty">Select a branch, checkout or commit to see what it is ahead / behind.</div>';
}

$("#q").addEventListener("input", e => {
  state.q = e.target.value.trim().toLowerCase();
  (DATA?.repos || []).forEach((r, i) => {
    drawTable(r, i);
    document.querySelectorAll(`#graph-${i} .grow`).forEach(el =>
      el.classList.toggle("match", !!state.q && el.textContent.toLowerCase().includes(state.q)));
  });
});

const setTop = () => document.documentElement.style.setProperty("--top", $(".top").offsetHeight + "px");
addEventListener("resize", setTop);
setTop();
render();
</script>
</body>
</html>
