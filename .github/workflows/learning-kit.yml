name: learning-kit

on:
  push:
    paths: ["learning-kit/**", ".github/workflows/learning-kit.yml"]
  pull_request:
    paths: ["learning-kit/**", ".github/workflows/learning-kit.yml"]

defaults:
  run:
    working-directory: learning-kit

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (stdlib only, no network, fake grader)
        run: python -B -m unittest discover -s tests -v
      - name: CLI smoke
        shell: bash
        run: |
          export LK_HOME="$RUNNER_TEMP/lk-home"
          python lk.py install --skills-dir "$RUNNER_TEMP/skills"
          python -m lk stats
          python lk.py topic new "Smoke Test" --depth aware
          python lk.py topic status SMOKE-TEST
      - name: Editable install puts `lk` on PATH
        shell: bash
        run: |
          python -m pip install -e . --quiet
          LK_HOME="$RUNNER_TEMP/lk-home" lk topic list
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          node-version: "20"
      - name: JS syntax
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: node --check web/app.js
