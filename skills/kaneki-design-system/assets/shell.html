      }).join('') + '</div>';
    });
    if (SYS.sources && SYS.sources.length) h += '<section class="dsg-section"><h3 class="dsg-section__title">' + L.sources + '</h3><ul class="dsg-note">' + SYS.sources.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ul></section>';
    if (SYS.date) h += '<p class="dsg-note dsg-muted" style="margin-top:24px;font-size:12px">' + L.updated + ' ' + esc(SYS.date) + '</p>';
    return h + '</div>';
  }
  /* ---------------- foundations ---------------- */
  function table(head, rows) {
    return '<div class="dsg-table-wrap"><table class="dsg-table"><thead><tr>' + head.map(function (x) { return '<th' + (x.num ? ' class="is-num"' : '') + '>' + (x.t || x) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  }
  function fpage(id) {
    var f = FOUND.filter(function (x) { return x.id === id; })[0];
    var lead = (T.notes && T.notes[id]) || '';
    var h = '<div class="dsg-page"><p class="dsg-eyebrow">' + L.foundations + '</p><h1 class="dsg-h1">' + f.name + '</h1>';
    if (id === 'principles') {
      h += '<div class="dsg-cards" style="margin-top:20px">' + PRIN.map(function (p) { return '<div class="dsg-card"><h4>' + esc(p.title) + '</h4><p>' + (p.body || '') + '</p></div>'; }).join('') + '</div>';
    } else if (id === 'colour') {
      h += lead ? '<p class="dsg-lead">' + lead + '</p>' : '';
      var groups = []; T.color.forEach(function (t) { var g = t.group || L.colour; if (groups.indexOf(g) < 0) groups.push(g); });
      groups.forEach(function (g) {
        h += '<section class="dsg-section"><h3 class="dsg-section__title">' + esc(g) + '</h3><div class="dsg-swatches">' + T.color.filter(function (t) { return (t.group || L.colour) === g; }).map(function (t) {
          return '<div class="dsg-swatch"><div class="dsg-swatch__chip">' + THEMES.map(function (th) {
            var v = t.resolved[th.id]; return '<span style="background:' + esc(v) + '" title="' + esc(th.name + ': ' + v) + '"><em>' + esc(THEMES.length > 1 ? th.name : v) + '</em></span>';
          }).join('') + '</div><div class="dsg-swatch__meta"><div class="dsg-swatch__name">--' + esc(t.name) + (t.alias ? ' <span class="dsg-badge">' + L.alias + ' → ' + esc(t.alias) + '</span>' : '') + '</div>' +
            '<div class="dsg-swatch__use">' + (t.usage || '') + '</div><div class="dsg-swatch__vals">' + THEMES.map(function (th) { return (THEMES.length > 1 ? esc(th.name) + ' ' : '') + esc(t.resolved[th.id]); }).join('<br>') + '</div></div></div>';
        }).join('') + '</div></section>';
      });
    } else if (id === 'type') {
      h += lead ? '<p class="dsg-lead">' + lead + '</p>' : '';
      if (T.fonts && T.fonts.length) h += '<section class="dsg-section"><h3 class="dsg-section__title">' + L.families + '</h3>' + table([L.token, L.value, L.use], T.fonts.map(function (t) {
        return '<tr><td class="dsg-mono">--' + esc(t.name) + '</td><td style="font-family:' + esc(t.css) + ';color:var(--dsg-ink)">' + esc(t.css) + '</td><td class="dsg-cell">' + (t.usage || '') + '</td></tr>'; })) + '</section>';
      h += '<section class="dsg-section">' + T.type.map(function (s) {
        var st = 'font-family:' + s.familyCss + ';font-size:' + s.size + ';line-height:' + s.lineHeight + ';font-weight:' + s.weight + (s.letterSpacing ? ';letter-spacing:' + s.letterSpacing : '') + (s.transform ? ';text-transform:' + s.transform : '');
        return '<div class="dsg-typerow"><div><b style="font-size:13px">' + esc(s.name) + '</b>' + (s.className ? '<div class="dsg-typerow__meta">.' + esc(s.className) + '</div>' : '') + '</div><div class="dsg-typerow__sample" style="' + esc(st) + '">' + esc(s.sample || 'The quick brown fox') + '</div>' +
          '<div class="dsg-typerow__meta">' + esc(s.size + ' / ' + s.lineHeight + ' · ' + s.weight + (s.letterSpacing ? ' · ' + s.letterSpacing : '')) + '<br>' + esc(s.familyLabel) + (s.usage ? '<br>' + s.usage : '') + '</div></div>';
      }).join('') + '</section>';
    } else if (id === 'spacing') {
      h += lead ? '<p class="dsg-lead">' + lead + '</p>' : '';
      h += '<section class="dsg-section"><div class="dsg-scale">' + T.spacing.map(function (t) {
        return '<div class="dsg-scale__row"><code class="dsg-mono">--' + esc(t.name) + '</code><span class="dsg-muted dsg-mono">' + esc(t.value) + '</span><div style="display:flex;align-items:center;gap:12px;min-width:0"><span class="dsg-scale__bar" style="width:' + Math.min(t.px == null ? 0 : t.px * 3, 480) + 'px"></span><span class="dsg-muted" style="font-size:12px">' + (t.usage || '') + '</span></div></div>';
      }).join('') + '</div></section>';
    } else if (id === 'radius') {
      h += lead ? '<p class="dsg-lead">' + lead + '</p>' : '';
      h += '<section class="dsg-section"><div class="dsg-radius">' + T.radius.map(function (t) {
        var r = t.px != null && t.px > 42 ? '42px' : t.value;
        return '<div><div class="dsg-radius__box" style="border-radius:' + esc(r) + '"></div><div style="margin-top:8px"><b class="dsg-mono">--' + esc(t.name) + '</b> <span class="dsg-muted">' + esc(t.value) + '</span></div><div class="dsg-muted" style="font-size:12px">' + (t.usage || '') + '</div></div>';
      }).join('') + '</div></section>';
    } else if (id === 'elevation') {
      h += lead ? '<p class="dsg-lead">' + lead + '</p>' : '';
      h += '<section class="dsg-section">' + stages('<div class="dsg-elev">' + T.shadow.map(function (t) {
        return '<div><div class="dsg-elev__box" style="box-shadow:var(--' + esc(t.name) + ')">--' + esc(t.name) + '</div><div style="font-size:12px;margin-top:10px;opacity:.75">' + (t.usage || '') + '</div></div>';
      }).join('') + '</div>') + '</section>';
    } else if (id === 'motion') {
      h += '<p class="dsg-lead">' + (lead || L.motionLead) + '</p><section class="dsg-section">' + table([L.token, L.value, L.use, L.play], T.motion.map(function (t, i) {
        return '<tr><td class="dsg-mono">--' + esc(t.name) + '</td><td class="dsg-mono">' + esc(t.value) + '</td><td class="dsg-cell">' + (t.usage || '') + '</td><td style="width:240px">' +
          (t.kind ? '<div style="display:flex;gap:8px;align-items:center"><button class="dsg-btn dsg-btn--sm dsg-btn--icon" style="width:26px" data-motion="' + i + '" aria-label="' + L.play + '">' + gi('play', 'dsg-i--sm') + '</button><div class="dsg-motion" id="dsg-motion-' + i + '" style="flex:1;transition:none"><i style="transition:transform ' +
            esc(t.kind === 'duration' ? t.value + ' cubic-bezier(.2,0,0,1)' : '600ms ' + t.value) + '"></i></div></div>' : '') + '</td></tr>';
      })) + '</section>';
    } else if (id === 'icons') {
      var ic = D.icons;
      h += '<p class="dsg-lead">' + (lead ? lead + ' ' : '') + L.clickCopy + ' <code>' + esc('<svg class="' + ic.className + '"><use href="#i-NAME"/></svg>') + '</code></p><section class="dsg-section">' + stages('<div class="dsg-icons" style="--dsg-dummy:0">' + ic.names.map(function (n) {
        return '<button class="dsg-icon" data-icon="' + esc(n) + '" style="background:transparent;border-color:currentColor;color:inherit;opacity:.85"><svg class="' + esc(ic.className) + '" aria-hidden="true" style="width:22px;height:22px;color:inherit"><use href="#i-' + esc(n) + '"/></svg>' + esc(n) + '</button>';
      }).join('') + '</div>') + '</section>';
    } else if (id === 'contrast') {
      h += '<p class="dsg-lead">' + (lead || L.contrastLead) + '</p><section class="dsg-section">' + table([L.pair, L.theme, L.sample, { t: L.ratio, num: 1 }, { t: L.min, num: 1 }, L.result], D.contrast.map(function (p) {
        var k = p.result === 'pass' ? 'ok' : p.result === 'fail' ? 'bad' : 'warn';
        return '<tr><td class="dsg-mono">' + esc(p.fg) + ' on ' + esc(p.bg) + (p.note ? '<div class="dsg-muted" style="font-family:var(--dsg-font)">' + p.note + '</div>' : '') + '</td><td>' + esc(p.themeName) + '</td>' +
          '<td><span class="dsg-aa" style="color:' + esc(p.fgValue) + ';background:' + esc(p.bgValue) + '">Aa</span></td><td class="is-num dsg-mono">' + (p.ratio ? p.ratio.toFixed(2) + ':1' : '—') + '</td><td class="is-num dsg-mono">' + esc(p.min) + ':1</td>' +
          '<td><span class="dsg-badge dsg-badge--' + k + '">' + (p.result === 'pass' ? L.pass : p.result === 'fail' ? L.fail : L.unchecked) + '</span></td></tr>';
      })) + '</section>';
    } else if (id === 'more') {
      T.other.forEach(function (fam) {
        h += '<section class="dsg-section"><h3 class="dsg-section__title">' + esc(fam.title) + '</h3>' + table([L.token, L.value, L.use], fam.tokens.map(function (t) {
          return '<tr><td class="dsg-mono">--' + esc(t.name) + '</td><td class="dsg-mono">' + esc(t.value) + '</td><td class="dsg-cell">' + (t.usage || '') + '</td></tr>'; })) + '</section>';
      });
    } else if (id === 'export') {
      h += '<p class="dsg-lead">' + L.expLead + '</p>';
      (D.exports || []).forEach(function (x) { h += '<section class="dsg-section"><div class="dsg-example">' + codeBlock(x.text, x.file, x.file).replace('dsg-codebar"', 'dsg-codebar" style="border-top:0"') + '</div></section>'; });
    }
    return h + '</div>';
  }
  /* ---------------- nav + routing ---------------- */
  function nav(q) {
    q = (q || '').toLowerCase().trim();
    var hit = function (s) { return !q || s.toLowerCase().indexOf(q) >= 0; };
    var h = !q ? '<a href="#overview" data-id="overview">' + gi('layers') + L.overview + '</a>' : '';
    var fs = FOUND.filter(function (f) { return hit(f.name + ' ' + f.id); });
    if (fs.length) h += '<div class="dsg-nav__group">' + L.foundations + '</div>' + fs.map(function (f) { return '<a href="#f/' + f.id + '" data-id="f/' + f.id + '">' + esc(f.name) + '</a>'; }).join('');
    var ss = SCREENS.filter(function (s) { return hit(s.name + ' ' + (s.summary || '')); });
    if (ss.length) h += '<div class="dsg-nav__group">' + L.screens + '</div>' + ss.map(function (s) { return '<a href="#s/' + esc(s.id) + '" data-id="s/' + esc(s.id) + '">' + gi('screen', 'dsg-i--sm') + esc(s.name) + '</a>'; }).join('');
    var any = fs.length + ss.length;
    GROUPS.forEach(function (g) {
      var items = COMPS.filter(function (c) { return c.group === g && hit(c.name + ' ' + g + ' ' + c.classes.map(function (k) { return k.name; }).join(' ')); });
      any += items.length;
      if (items.length) h += '<div class="dsg-nav__group">' + esc(g) + '</div>' + items.map(function (c) { return '<a href="#c/' + esc(c.id) + '" data-id="c/' + esc(c.id) + '">' + esc(c.name) + '<span class="dsg-count">' + c.examples.length + '</span></a>'; }).join('');
    });
    if (q && !any) h = '<div class="dsg-nav__empty">' + L.noMatch + ' “' + esc(q) + '”</div>';
    $('#dsg-nav').innerHTML = h; mark();
  }
  function current() { var h = decodeURIComponent((location.hash || '#overview').slice(1)); return h || 'overview'; }
  function mark() { var id = current(); document.querySelectorAll('.dsg-nav a').forEach(function (a) { var on = a.dataset.id === id; a.classList.toggle('is-selected', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }); }
  function modeBar() {
    var icon = function (t) { return t.scheme === 'dark' ? 'moon' : 'sun'; };
    var b = THEMES.map(function (t) { return '<button data-m="' + esc(t.id) + '" title="' + esc(t.name) + '">' + gi(icon(t), 'dsg-i--sm') + '<span>' + esc(t.name) + '</span></button>'; });
    if (THEMES.length > 1) b.push('<button data-m="split" title="' + L.split + '">' + gi('split', 'dsg-i--sm') + '<span>' + L.split + '</span></button>');
    $('#dsg-mode').innerHTML = b.join(''); $('#dsg-mode').setAttribute('aria-label', L.theme);
  }
  function render(keepScroll) {
    var id = current(), kind = id.split('/')[0], key = id.slice(kind.length + 1), top = $('#dsg-main').scrollTop;
    var c = kind === 'c' && COMPS.filter(function (x) { return x.id === key; })[0];
    var s = kind === 's' && SCREENS.filter(function (x) { return x.id === key; })[0];
    var f = kind === 'f' && FOUND.filter(function (x) { return x.id === key; })[0];
    codes = []; seq = 0;
    $('#dsg-main').innerHTML = c ? compPage(c) : s ? screenPage(s) : f ? fpage(key) : overview();
    var sep = ' ' + gi('chevron-right', 'dsg-i--sm') + ' ';
    $('#dsg-crumb').innerHTML = '<span>' + esc(SYS.name || L.designSystem) + '</span>' + sep + (c ? '<span>' + esc(c.group) + '</span>' + sep + '<b>' + esc(c.name) + '</b>' : s ? '<span>' + L.screens + '</span>' + sep + '<b>' + esc(s.name) + '</b>' : f ? '<span>' + L.foundations + '</span>' + sep + '<b>' + esc(f.name) + '</b>' : '<b>' + L.overview + '</b>');
    document.title = (c ? c.name : s ? s.name : f ? f.name : L.overview) + ' · ' + (SYS.name || L.designSystem);
    document.documentElement.setAttribute('data-dsg-scheme', chromeScheme());
    document.querySelectorAll('#dsg-mode button').forEach(function (b) { var on = b.dataset.m === mode; b.classList.toggle('is-selected', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
    /* an example too wide for half the page stacks its themes instead of scrolling sideways */
    document.querySelectorAll('.dsg-stages.is-split:not(.is-wide)').forEach(function (g) {
      if ([].some.call(g.querySelectorAll('.dsg-stage'), function (st) { return st.scrollWidth > st.clientWidth + 4; })) g.classList.add('is-wide');
    });
    mark(); $('#dsg-main').scrollTop = keepScroll ? top : 0;
    document.body.classList.remove('is-nav-open');
  }
  var toastT;
  function toast(msg) { var t = $('#dsg-toast'); t.textContent = msg; t.classList.add('is-on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('is-on'); }, 1400); }
  function copyText(txt, done) {
    var fallback = function () { var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); done(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
  }
  document.addEventListener('click', function (e) {
    var tl = e.target.closest('.dsg-tile'); if (tl) { location.hash = tl.dataset.href; return; }
    var t = e.target.closest('[data-toggle]'); if (t) { var p = document.getElementById('dsg-code-' + t.dataset.toggle); p.hidden = !p.hidden; t.setAttribute('aria-expanded', String(!p.hidden)); t.lastChild.textContent = p.hidden ? L.show : L.hide; return; }
    var cp = e.target.closest('[data-copy]'); if (cp) { copyText(codes[+cp.dataset.copy].text, function () { cp.lastChild.textContent = L.copied; setTimeout(function () { cp.lastChild.textContent = L.copy; }, 1400); }); return; }
    var dl = e.target.closest('[data-download]'); if (dl) { var x = codes[+dl.dataset.download], a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([x.text], { type: 'text/plain;charset=utf-8' })); a.download = x.file; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500); return; }
    var ic = e.target.closest('[data-icon]'); if (ic) { var mk = '<svg class="' + D.icons.className + '"><use href="#i-' + ic.dataset.icon + '"/></svg>'; copyText(mk, function () { toast(L.copied + ': ' + ic.dataset.icon); }); return; }
    var mo = e.target.closest('[data-motion]'); if (mo) { var tr = document.getElementById('dsg-motion-' + mo.dataset.motion); tr.style.setProperty('--dsg-track', tr.clientWidth + 'px'); tr.classList.toggle('is-on'); return; }
    var m = e.target.closest('#dsg-mode button'); if (m) { mode = m.dataset.m; try { localStorage.setItem(KEY, mode); } catch (er) {} render(true); return; }
    if (e.target.closest('#dsg-menu')) { document.body.classList.toggle('is-nav-open'); return; }
    if (e.target.closest('#dsg-scrim')) { document.body.classList.remove('is-nav-open'); return; }
  });
  document.addEventListener('keydown', function (e) {
    var tl = e.target.closest && e.target.closest('.dsg-tile'); if (tl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); location.hash = tl.dataset.href; return; }
    var typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable;
    if (e.key === '/' && !typing) { e.preventDefault(); document.body.classList.add('is-nav-open'); $('#dsg-q').focus(); }
    if (e.key === 'Escape') { if (e.target.id === 'dsg-q' && e.target.value) { e.target.value = ''; nav(''); } else document.body.classList.remove('is-nav-open'); }
  });
  $('#dsg-q').addEventListener('input', function (e) { nav(e.target.value); });
  $('#dsg-q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { var a = document.querySelector('.dsg-nav a'); if (a) { location.hash = a.getAttribute('href'); } } });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (mode === 'split') render(true); }); } catch (e) {}
  window.addEventListener('hashchange', function () { render(false); });
  $('#dsg-q').placeholder = L.filter; $('#dsg-q').setAttribute('aria-label', L.filter); $('#dsg-menu').setAttribute('aria-label', L.menu);
  $('#dsg-brand').textContent = SYS.name || L.designSystem;
  $('#dsg-brand-sub').textContent = L.designSystem + (SYS.version ? ' · ' + SYS.version : '');
  $('#dsg-mark').textContent = (SYS.name || 'D').trim().charAt(0).toUpperCase();
  modeBar(); nav(''); render(false);
})();
</script>
</body>
</html>
